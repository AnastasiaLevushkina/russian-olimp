<title>Олимпиадные задания по русскому языку</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1020;--card:#171A30;--ink:#EEF0FA;--soft:#9AA0C3;--line:#252A48;--accent:#97A5FF;--mark:#F2D04B;--marktext:#151832;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0E1020;--card:#171A30;--ink:#EEF0FA;--soft:#9AA0C3;--line:#252A48;--accent:#97A5FF;--mark:#F2D04B;--marktext:#151832;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Golos Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:clamp(28px,6vw,64px) 20px 72px}
h1{font:700 clamp(2.1rem,6.5vw,3.7rem)/1.05 Literata,Georgia,"PT Serif",serif;letter-spacing:-.02em;margin:0 0 16px;max-width:15ch}
.lead{margin:0;color:var(--soft);max-width:60ch}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.filters input{flex:1 1 100%;font:italic 400 clamp(1.15rem,3vw,1.5rem)/1.3 Literata,Georgia,"PT Serif",serif;color:var(--ink);background:none;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:.5rem 0;min-height:52px;margin-bottom:10px}
.filters input::placeholder{color:var(--soft)}
.filters select{appearance:none;-webkit-appearance:none;font:500 .92rem "Golos Text","Segoe UI",system-ui,sans-serif;color:var(--ink);background-color:var(--card);border:1px solid var(--line);border-radius:999px;padding:.5rem 2.1rem .5rem 1rem;min-height:44px;cursor:pointer;max-width:100%;
background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.filters select.on{background-color:var(--mark);color:var(--marktext);border-color:var(--mark)}
:is(input,select,button,a):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:30px 0 0;padding-bottom:10px;border-bottom:2px solid var(--ink);color:var(--soft)}
#count{font:italic 1.05rem Literata,Georgia,"PT Serif",serif}
.bar button{font:inherit;color:var(--accent);background:none;border:0;padding:.4rem 0;min-height:40px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:200px 1fr;gap:6px 28px;padding:22px 0;border-bottom:1px solid var(--line)}
.side{font-size:.88rem;color:var(--soft);line-height:1.45}
.side b{display:block;color:var(--ink);font-weight:600;font-size:.97rem}
.head{font:700 1.22rem/1.3 Literata,Georgia,"PT Serif",serif;margin:0 0 6px}
.d{margin:0;font:400 1.05rem/1.6 Literata,Georgia,"PT Serif",serif;max-width:64ch}
.pdf{display:inline-block;margin-top:10px;font-size:.9rem;font-weight:500;color:var(--accent);text-underline-offset:3px}
mark{background:var(--mark);color:var(--marktext);padding:0 .12em;border-radius:2px}
.more{display:block;margin:30px auto 0;font:600 .95rem "Golos Text","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--ink);border-radius:999px;padding:.65rem 1.6rem;min-height:46px;cursor:pointer}
.empty{padding:28px 0;color:var(--soft);font:italic 1.05rem Literata,Georgia,serif}
@media (max-width:700px){li{grid-template-columns:1fr;gap:8px}.side{display:flex;flex-wrap:wrap;gap:2px 12px}.side b{display:inline}}
@media (prefers-reduced-motion:no-preference){.filters select,.more{transition:background-color .15s,color .15s}}
</style>

<div class="wrap">
<h1>Олимпиадные задания по русскому языку</h1>
<p class="lead">Выберите олимпиаду, год, этап, класс или раздел, либо найдите задание по слову. Описания пересказаны кратко; полный текст — в PDF по ссылке.</p>
<div class="filters">
<input id="q" type="search" placeholder="Поиск по описанию, например: чередование" aria-label="Поиск">
<select id="fo" aria-label="Олимпиада"></select>
<select id="fy" aria-label="Учебный год"></select>
<select id="fs" aria-label="Этап"></select>
<select id="fc" aria-label="Класс"></select>
<select id="fk" aria-label="Раздел"></select>
</div>
<div class="bar"><span id="count" aria-live="polite"></span><button id="reset" type="button">Сбросить фильтры</button></div>
<ol id="list"></ol>
<p id="empty" class="empty" hidden>Ничего не найдено. Уберите часть фильтров или измените слово поиска.</p>
<button id="more" class="more" type="button" hidden>Показать ещё</button>
</div>

const $=s=>document.querySelector(s);
const el={q:$('#q'),o:$('#fo'),y:$('#fy'),s:$('#fs'),c:$('#fc'),k:$('#fk')};
const STEP=40;let shown=STEP,res=[];
function fill(sel,label,opts){sel.innerHTML='';sel.add(new Option(label,''));opts.forEach(o=>sel.add(new Option(o[1],o[0])))}
fill(el.o,'Все олимпиады',D.o.map((v,i)=>[i,v]));
fill(el.y,'Все годы',D.y.map((v,i)=>[i,v]));
fill(el.s,'Все этапы',D.s.map((v,i)=>[i,v]));
fill(el.c,'Все классы',[5,6,7,8,9,10,11].map(n=>[n,n+' класс']).concat([['n','Класс не указан']]));
fill(el.k,'Все разделы',D.k.map((v,i)=>[i,v]));
D.r.forEach(r=>{r.push((r[6]+' '+r[5].map(i=>D.k[i]).join(' ')+' '+D.u[r[7]][0]).toLowerCase())});
function run(){
const words=el.q.value.toLowerCase().split(/\s+/).filter(Boolean);
res=D.r.filter(r=>{
if(el.o.value!==''&&r[0]!=el.o.value)return false;
if(el.y.value!==''&&r[1]!=el.y.value)return false;
if(el.s.value!==''&&r[2]!=el.s.value)return false;
if(el.k.value!==''&&!r[5].includes(+el.k.value))return false;
if(el.c.value==='n'){if(r[8].length)return false}else if(el.c.value!==''&&!r[8].includes(+el.c.value))return false;
return words.every(w=>r[9].includes(w))});
[el.o,el.y,el.s,el.c,el.k].forEach(e=>e.classList.toggle('on',e.value!==''));shown=STEP;draw()}
function hl(n,s,w){if(!w.length){n.textContent=s;return}
const re=new RegExp('('+w.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
s.split(re).forEach((x,i)=>{if(i%2){const m=document.createElement('mark');m.textContent=x;n.append(m)}else if(x)n.append(x)})}
function draw(){
const list=$('#list');list.innerHTML='';
const w=el.q.value.toLowerCase().split(/\s+/).filter(Boolean);
const mk=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e};
res.slice(0,shown).forEach(r=>{
const li=mk('li');
const sd=mk('div',null,'side');
sd.append(mk('b',D.o[r[0]]),mk('div',D.y[r[1]]+', '+D.s[r[2]].toLowerCase()+' этап'),mk('div',(r[3]==='Не указан'?'класс не указан':r[3]+' класс')+', № '+r[4]));
const bd=mk('div');
const p=mk('p',null,'d');hl(p,r[6],w);
const a=mk('a','Открыть PDF','pdf');a.href=D.u[r[7]][1];a.target='_blank';a.rel='noopener noreferrer';a.title=D.u[r[7]][0];
bd.append(mk('h2',r[5].map(i=>D.k[i]).join(' / '),'head'),p,a);
li.append(sd,bd);list.append(li)});
$('#count').textContent='Найдено: '+res.length+' из '+D.r.length;
$('#empty').hidden=res.length>0;
$('#more').hidden=res.length<=shown}
Object.values(el).forEach(e=>e.addEventListener(e===el.q?'input':'change',run));
$('#more').addEventListener('click',()=>{shown+=STEP;draw()});
$('#reset').addEventListener('click',()=>{Object.values(el).forEach(e=>e.value='');run()});
run();
</script>
